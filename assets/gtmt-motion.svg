<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">AHT20 BLE data acquisition motion banner</title>
  <desc id="desc">Animated SVG banner for AHT20, BLE, UART, LCD and SQLite logging.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="48%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0f4c81"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes float { 0%,100% { transform: translateY(0); opacity: .8; } 50% { transform: translateY(-10px); opacity: 1; } }
      @keyframes pulse { 0%,100% { opacity:.35; r:4; } 50% { opacity:1; r:8; } }
      .title { font: 800 46px Segoe UI, Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .sub { font: 650 20px Segoe UI, Arial, sans-serif; fill: #dbeafe; letter-spacing: 0; }
      .mono { font: 700 16px Consolas, monospace; fill: #a7f3d0; }
      .card { fill: rgba(15,23,42,.62); stroke: rgba(255,255,255,.24); stroke-width: 1.2; }
      .label { font: 700 16px Segoe UI, Arial, sans-serif; fill: #ecfeff; }
      .wire { fill: none; stroke: #fbbf24; stroke-width: 4; stroke-linecap: round; filter: url(#glow); }
    </style>
  </defs>
  <rect width="1100" height="300" rx="26" fill="url(#bg)"/>
  <g transform="translate(70 58)">
    <text x="0" y="0" class="mono">Giao tiep may tinh / data acquisition lab</text>
    <text x="0" y="68" class="title">AHT20 BLE Data Acquisition</text>
    <text x="0" y="104" class="sub">I2C Sensor - LCD - BLE Advertising - UART - SQLite Logger</text>
  </g>
  <path class="wire" d="M762 136 H842 Q862 136 862 154 H934 Q954 154 954 136 H1018"/>
  <path class="wire" opacity=".48" d="M802 246 H888 Q908 246 908 260 H1016" style="animation-delay:.55s"/>
  <g style="animation: float 5.2s ease-in-out infinite">
    <rect x="712" y="46" width="118" height="58" rx="18" class="card"/>
    <text x="748" y="81" class="label">AHT20</text>
  </g>
  <g style="animation: float 5.8s ease-in-out infinite">
    <rect x="878" y="60" width="112" height="58" rx="18" class="card"/>
    <text x="914" y="95" class="label">BLE</text>
  </g>
  <g style="animation: float 6.3s ease-in-out infinite">
    <rect x="740" y="174" width="112" height="58" rx="18" class="card"/>
    <text x="776" y="209" class="label">UART</text>
  </g>
  <g style="animation: float 6.8s ease-in-out infinite">
    <rect x="910" y="178" width="116" height="58" rx="18" class="card"/>
    <text x="944" y="213" class="label">SQLite</text>
  </g>
  <g fill="#a7f3d0" filter="url(#glow)">
    <circle cx="862" cy="154" r="4" style="animation:pulse 2s ease-in-out infinite"/>
    <circle cx="954" cy="136" r="4" style="animation:pulse 2.4s ease-in-out infinite"/>
    <circle cx="908" cy="260" r="4" style="animation:pulse 2.8s ease-in-out infinite"/>
    <circle cx="1016" cy="260" r="4" style="animation:pulse 2.2s ease-in-out infinite"/>
  </g>
  <text x="70" y="258" class="sub">Embedded C + sensor telemetry + Windows logger + engineering evidence</text>
</svg>
